apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-servicemonitor
  labels:
    app: kafka
    kafka_cr: kafka
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: kafka
      kafka_cr: kafka
  namespaceSelector:
    matchNames:
    - kafka
  endpoints:
  - interval: 10s
    port: metrics
    path: /metrics
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_ip]
      separator: ;
      regex: (.*)
      targetLabel: pod_ip
      replacement: $1
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_label_brokerId]
      separator: ;
      regex: (.*)
      targetLabel: brokerId
      replacement: $1
      action: replace
    - sourceLabels: [__meta_kubernetes_pod_label_kafka_cr]
      separator: ;
      regex: (.*)
      targetLabel: kafka_cr
      replacement: $1
      action: replace
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cruisecontrol-servicemonitor
  labels:
    app: cruisecontrol
    kafka_cr: kafka
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: cruisecontrol
  namespaceSelector:
    matchNames:
    - kafka
  endpoints:
  - interval: 10s
    port: metrics
    path: /metrics
    honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  creationTimestamp: null
  labels:
    prometheus: kafka-rules
  name: kafka-alerts
spec:
  groups:
  - name: KafkaAlerts
    rules:
    # Broker alerts are diagnostic only. These example thresholds are not capacity limits.
    - alert: BrokerRequestRateHigh
      expr: sum by(brokerId, kafka_cr, namespace) (rate(kafka_network_requestmetrics_requests_total[15m])) > 30
      for: 5m
      labels:
        severity: alert
        alertGroup: kafka
      annotations:
        description: 'broker {{ $labels.brokerId }} request rate is high (current value is: {{ $value | printf "%.2f" }} requests/s); verify capacity and latency before scaling'
        summary: 'high broker request rate (diagnostic only)'
    - alert: BrokerUnderReplicated
      expr: kafka_server_replicamanager_underreplicatedpartitions > 0
      for: 5m
      labels:
        severity: alert
        alertGroup: kafka
      annotations:
        description: 'broker {{ $labels.brokerId }} underreplicated'
        summary: 'broker underreplicated'
    - alert: PartitionCountHigh
      expr: kafka_server_replicamanager_partitioncount > 100
      for: 3m
      labels:
        severity: alert
        alertGroup: kafka
      annotations:
        description: 'broker {{ $labels.brokerId }} has high partition count'
        summary: 'high partition count'
    - alert: PartitionCountLow
      expr: bottomk(1, kafka_server_replicamanager_partitioncount) by (namespace, kafka_cr) < 40
      for: 3m
      labels:
        severity: alert
        alertGroup: kafka
      annotations:
        description: 'broker {{ $labels.brokerId }} has low partition count'
        summary: 'low partition count'
    - alert: RemainingDiskSpaceLow
      expr: (kubelet_volume_stats_available_bytes{job="kubelet",metrics_path="/metrics",namespace=~".*",persistentvolumeclaim=~"kafka-.*"}/ kubelet_volume_stats_capacity_bytes{job="kubelet",metrics_path="/metrics",namespace=~".*",persistentvolumeclaim=~"kafka-.*"})< 0.15 and predict_linear(kubelet_volume_stats_available_bytes{job="kubelet",metrics_path="/metrics",namespace=~".*",persistentvolumeclaim=~"kafka-.*"}[6h], 4 * 24 * 3600) < 0
      for: 2m
      labels:
        severity: alert
        alertGroup: kafka
      annotations:
        description: 'broker has low disk space'
        summary: 'low diskspace'
        command: "resizePvc"
        incrementBy: "10G"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources:
  - configmaps
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: kafka
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: kafka-prometheus
spec:
  podMonitorSelector:
    matchLabels:
      release: prometheus-operator
  serviceAccountName: prometheus
  alerting:
    alertmanagers:
    - namespace: kafka
      name: kafka-alertmanager
      port: web
  serviceMonitorSelector:
    matchLabels:
      kafka_cr: kafka
      release: prometheus-operator
  ruleSelector:
    matchLabels:
      prometheus: kafka-rules
  resources:
    requests:
      memory: 400Mi
  enableAdminAPI: false
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-kafka-alertmanager
stringData:
  alertmanager.yaml: |
    route:
      receiver: monitoring
      group_by: [alertname, namespace, kafka_cr]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: koperator-storage
        matchers:
        - alertname="RemainingDiskSpaceLow"
        - alertGroup="kafka"
    receivers:
    # Configure your human notification integration here before using this sample.
    - name: monitoring
    - name: koperator-storage
      webhook_configs:
      # Assumes the Helm release is named kafka-operator in the kafka namespace.
      - url: http://kafka-operator-alertmanager.kafka.svc:9001/
        send_resolved: true
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: kafka-alertmanager
spec:
  replicas: 1
  resources:
    requests:
      memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-alertmanager
spec:
  selector:
    alertmanager: kafka-alertmanager
  ports:
  - name: web
    port: 9093
    targetPort: 9093
