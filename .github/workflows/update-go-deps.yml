name: Update Dependencies

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Update Go dependencies
        run: make update-go-deps

      - name: Update supported Kubernetes targets
        run: make update-kubernetes-versions

      - name: Tidy dependencies
        run: make tidy

      - name: Generate manifests
        run: make generate manifests

      - name: Format and lint fix
        run: make fmt lint-fix

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT }}
          commit-message: 'chore(deps): update Go dependencies and Kubernetes targets'
          title: 'chore(deps): update Go dependencies and Kubernetes targets'
          body: |
            ## Description

            Update Go dependencies/tooling and the managed Kubernetes test targets.
            Regenerate manifests and derived support documentation. References #386.

            Kubernetes targets follow the oldest/newest upstream-supported minors.
            Review any increase to the minimum supported version. CI validation is required.

            ## Type of Change
            <!-- Place an '[x]' (no spaces) in all applicable fields. Please remove unrelated fields. -->
            - [ ] Bug Fix
            - [ ] New Feature
            - [ ] Breaking Change
            - [ ] Refactor
            - [ ] Documentation
            - [x] Other (please describe): dependency and Kubernetes target updates

            ## Checklist
            <!-- Place an '[x]' (no spaces) in all applicable fields. Please remove unrelated fields. -->
            - [ ] I have read the [contributing guidelines](../CONTRIBUTING.md)
            - [x] Existing issues have been referenced (where applicable)
            - [ ] I have verified this change is not present in other open pull requests
            - [ ] Functionality is documented
            - [ ] All code style checks pass
            - [ ] New code contribution is covered by automated tests
            - [ ] All new and existing tests pass
          branch: automated/update-go-deps
          delete-branch: true
          labels: |
            dependencies
            go
            automated

